name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            cmake -B build -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
              -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          else
            cmake -B build
          fi

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "build/Gizmo_artefacts/Release/VST3/Gizmo.vst3" -DestinationPath "dist/Gizmo-Windows-VST3.zip"
          Compress-Archive -Path "build/solista/Solista_artefacts/Release/VST3/Solista.vst3" -DestinationPath "dist/Solista-Windows-VST3.zip"
          Compress-Archive -Path "build/dedal/Dedal_artefacts/Release/VST3/Dedal.vst3" -DestinationPath "dist/Dedal-Windows-VST3.zip"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          cd build/Gizmo_artefacts/Release
          codesign --force --deep --sign - VST3/Gizmo.vst3
          codesign --force --deep --sign - AU/Gizmo.component
          ditto -c -k --keepParent VST3/Gizmo.vst3 "$GITHUB_WORKSPACE/dist/Gizmo-macOS-VST3.zip"
          ditto -c -k --keepParent AU/Gizmo.component "$GITHUB_WORKSPACE/dist/Gizmo-macOS-AU.zip"
          cd "$GITHUB_WORKSPACE/build/solista/Solista_artefacts/Release"
          codesign --force --deep --sign - VST3/Solista.vst3
          codesign --force --deep --sign - AU/Solista.component
          ditto -c -k --keepParent VST3/Solista.vst3 "$GITHUB_WORKSPACE/dist/Solista-macOS-VST3.zip"
          ditto -c -k --keepParent AU/Solista.component "$GITHUB_WORKSPACE/dist/Solista-macOS-AU.zip"
          cd "$GITHUB_WORKSPACE/build/dedal/Dedal_artefacts/Release"
          codesign --force --deep --sign - VST3/Dedal.vst3
          codesign --force --deep --sign - AU/Dedal.component
          ditto -c -k --keepParent VST3/Dedal.vst3 "$GITHUB_WORKSPACE/dist/Dedal-macOS-VST3.zip"
          ditto -c -k --keepParent AU/Dedal.component "$GITHUB_WORKSPACE/dist/Dedal-macOS-AU.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Plugins-${{ matrix.name }}
          path: dist/*.zip

  release:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Replace the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/*.zip \
            --target "${{ github.sha }}" \
            --title "Gizmo, Solista i Dedal (najnowsza wersja)" \
            --notes "Zbudowane automatycznie z commita ${{ github.sha }}. Instrukcja instalacji jest w README."
